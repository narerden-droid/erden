<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Журнал отсутствия</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/signature_pad/4.1.7/signature_pad.umd.min.js"></script>
<style>
:root{
  --bg:#f6f5fb; --card:#ffffff; --text:#1f1b2e; --muted:#6b6478;
  --accent:#673ab7; --border:#dcd6e8; --err:#c0392b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17141f; --card:#211d2e; --text:#efeaf8; --muted:#a89fbb;
    --border:#3a3350;
  }
}
:root[data-theme="dark"]{
  --bg:#17141f; --card:#211d2e; --text:#efeaf8; --muted:#a89fbb; --border:#3a3350;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
.card{max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px 24px}
h1{font-size:20px;margin:0 0 4px;border-left:6px solid var(--accent);padding-left:10px}
p.req{color:var(--muted);font-size:13px;margin-top:0}
label{display:block;font-size:14px;font-weight:600;margin:18px 0 6px}
label .star{color:var(--err)}
select,input[type=text],input[type=datetime-local]{
  width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--text);font-size:14px}
canvas{border:1px solid var(--border);border-radius:8px;width:100%;height:160px;touch-action:none;background:#fff}
.sig-actions{margin-top:6px}
button{cursor:pointer;border:none;border-radius:8px;font-size:14px;padding:10px 16px}
#clearSig{background:transparent;border:1px solid var(--border);color:var(--text)}
#submitBtn{background:var(--accent);color:#fff;width:100%;margin-top:22px;padding:12px}
#submitBtn:disabled{opacity:.6;cursor:default}
#status{margin-top:14px;font-size:14px;text-align:center;overflow-wrap:anywhere}
#myRecords h2{font-size:16px;margin:28px 0 8px}
.rec{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px;overflow-wrap:anywhere}
.rec .dates{font-weight:600}
.rec .muted{color:var(--muted);font-size:13px;margin-top:2px}
.tbl-wrap{overflow-x:auto}
.rtbl{width:100%;border-collapse:collapse;font-size:13px}
.rtbl th,.rtbl td{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.rtbl th{background:var(--bg);font-weight:600}
.rtbl.adm{font-size:11px}
.rtbl.adm th,.rtbl.adm td{padding:4px 5px}
.rtbl.adm th:nth-child(4),.rtbl.adm td:nth-child(4){max-width:90px}
.err{color:var(--err)}
.ok{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:var(--card);color:#2e7d32;font-size:34px;font-weight:700;
  padding:40px 52px;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.3);
  z-index:999;
}
</style>
</head>
<body>
<div class="card" id="gateCard">
  <h1>Журнал отсутствия</h1>
  <label>Введите ваш код доступа <span class="star">*</span></label>
  <input type="text" id="accessCode" inputmode="numeric" placeholder="Например, 1001">
  <button id="loginBtn" style="margin-top:16px">Войти</button>
  <div id="gateStatus" style="margin-top:12px;font-size:14px"></div>
</div>

<div class="card" id="formCard" style="display:none">
  <h1>Журнал отсутствия</h1>
  <p class="req">* обязательные поля</p>

  <label>ФИО</label>
  <input type="text" id="fioDisplay" disabled style="background:var(--border);font-weight:600">
  <input type="hidden" id="accessCodeHidden">

  <label>С дата <span class="star">*</span></label>
  <input type="datetime-local" id="fromDate" required>

  <label>По дата <span class="star">*</span></label>
  <input type="datetime-local" id="toDate" required>

  <label>Причина отсутствия <span class="star">*</span></label>
  <select id="reason" required>
    <option value="">Выберите...</option>
    <option>Медицина и здоровье (врачи, анализы, больничные)</option>
    <option>Удаленная работа</option>
    <option>Личные и семейные обстоятельства</option>
    <option>Отгулы</option>
    <option>Прочее</option>
  </select>

  <label>Прочие</label>
  <input type="text" id="other">

  <label>Подпись <span class="star">*</span></label>
  <canvas id="sig"></canvas>
  <div class="sig-actions"><button type="button" id="clearSig">Очистить подпись</button></div>

  <button id="submitBtn">Отправить</button>
  <div id="status"></div>

  <div id="myRecords">
    <h2 id="recordsTitle">Мои записи</h2>
    <div id="recordsList" style="color:var(--muted);font-size:14px">Загрузка...</div>
  </div>
</div>

<script>
const canvas = document.getElementById('sig');
function resize(){ const r=canvas.getBoundingClientRect(); canvas.width=r.width*2; canvas.height=r.height*2; canvas.getContext('2d').scale(2,2); }
resize();
const pad = new SignaturePad(canvas, {backgroundColor:'#fff'});
document.getElementById('clearSig').onclick = () => pad.clear();

// TODO: replace with your deployed Apps Script Web App URL
const ENDPOINT = "https://script.google.com/macros/s/AKfycby-CciCiHg26D06HQse4WZ8NkcgAtRTboNojAFoi16hlR34Q5viD_eejctVpCRG-Ow/exec";

async function loadRecords() {
  const list = document.getElementById('recordsList');
  const code = document.getElementById('accessCodeHidden').value;
  try {
    const resp = await fetch(ENDPOINT + "?action=list&code=" + encodeURIComponent(code));
    const result = JSON.parse(await resp.text());
    list.textContent = "";
    if (result.status !== 'ok') { list.textContent = "Не удалось загрузить записи."; return; }
    document.getElementById('recordsTitle').textContent = result.isAdmin ? "Все записи" : "Мои записи";
    if (!result.records.length) { list.textContent = "Записей пока нет."; return; }
    const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
    const keyOf = s => {
      let m = /(\d{4})-(\d{2})-\d{2}/.exec(s);
      if (m) return m[1] + "-" + m[2];
      m = /\d{2}\.(\d{2})\.(\d{4})/.exec(s);
      return m ? m[2] + "-" + m[1] : "";
    };
    const sorted = result.records.map(r => ({ r, k: keyOf(r.from) }))
      .sort((a, b) => a.k < b.k ? 1 : a.k > b.k ? -1 : 0);
    const parseDT = s => {
      let m = /(\d{4})-(\d{2})-(\d{2})(?:[T ](\d{1,2}):(\d{2}))?/.exec(s);
      if (m) return new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0));
      m = /(\d{2})\.(\d{2})\.(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/.exec(s);
      if (m) return new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0));
      return null;
    };
    // Рабочий день 08:00–17:30, обед 12:00–13:30 => рабочее время 08:00–12:00 и 13:30–17:30 (8 ч).
    // Считается пересечение отсутствия с рабочим временем каждого дня (обед не считается).
    // Если отсутствие покрывает весь рабочий день (8 ч), это 1 дн.; иначе фактические часы.
    const WORK_SEGMENTS = [[8 * 60, 12 * 60], [13 * 60 + 30, 17 * 60 + 30]];
    const FULL_DAY_MIN = WORK_SEGMENTS.reduce((t, s) => t + s[1] - s[0], 0); // 480
    const calc = r => {
      const a = parseDT(r.from), b = parseDT(r.to);
      const res = { d: 0, m: 0 };
      if (!(a && b && b > a)) return res;
      let day = new Date(a.getFullYear(), a.getMonth(), a.getDate());
      while (day < b) {
        let mins = 0;
        WORK_SEGMENTS.forEach(([s, e]) => {
          const ws = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 0, s);
          const we = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 0, e);
          const from = a > ws ? a : ws;
          const to = b < we ? b : we;
          mins += Math.max(0, Math.round((to - from) / 60000));
        });
        if (mins >= FULL_DAY_MIN) res.d += 1; else res.m += mins;
        day = new Date(day.getFullYear(), day.getMonth(), day.getDate() + 1);
      }
      return res;
    };
    const isEmpty = x => !x.d && !x.m;
    const fmtDur = x => {
      const h = Math.floor(x.m / 60), mi = x.m % 60;
      const parts = [];
      if (x.d) parts.push(x.d + " дн.");
      if (h) parts.push(h + " ч.");
      if (mi) parts.push(mi + " мин.");
      return parts.join(" ") || "0 мин.";
    };
    const totals = {};
    sorted.forEach(({ r, k }) => {
      const c = calc(r); const t = totals[k] || { d: 0, m: 0 };
      t.d += c.d; t.m += c.m; totals[k] = t;
    });
    let lastKey = null, tbody = null;
    sorted.forEach(({ r, k }) => {
      if (k !== lastKey) {
        lastKey = k;
        const h = document.createElement('div');
        h.style.cssText = 'font-weight:700;margin:16px 0 8px;color:var(--accent)';
        const name = k ? MONTHS[parseInt(k.slice(5), 10) - 1] : null;
        h.textContent = (name ? name + " " + k.slice(0, 4) : "Без даты")
          + (!isEmpty(totals[k]) ? " · всего " + fmtDur(totals[k]) : "");
        list.appendChild(h);

        const wrap = document.createElement('div'); wrap.className = 'tbl-wrap';
        const table = document.createElement('table'); table.className = 'rtbl' + (result.isAdmin ? ' adm' : '');
        const thead = document.createElement('thead'); const hr = document.createElement('tr');
        (result.isAdmin ? ["ФИО", "Период", "Время", "Причина"] : ["Период", "Длительность", "Причина"])
          .forEach(t => { const th = document.createElement('th'); th.textContent = t; hr.appendChild(th); });
        thead.appendChild(hr); table.appendChild(thead);
        tbody = document.createElement('tbody'); table.appendChild(tbody);
        wrap.appendChild(table); list.appendChild(wrap);
      }
      const dur = calc(r);
      const cells = [];
      if (result.isAdmin) cells.push(r.fio);
      cells.push(r.from.replace('T', ' ') + " — " + r.to.replace('T', ' '));
      cells.push(!isEmpty(dur) ? fmtDur(dur) : "—");
      const reasonShort = result.isAdmin ? r.reason.replace(/\s*\(.*?\)/g, "") : r.reason;
      cells.push(reasonShort + (r.other ? " · " + r.other : ""));
      const tr = document.createElement('tr');
      cells.forEach(t => { const td = document.createElement('td'); td.textContent = t; tr.appendChild(td); });
      tbody.appendChild(tr);
    });
  } catch (e) {
    list.textContent = "Не удалось загрузить записи.";
  }
}

document.getElementById('loginBtn').onclick = async () => {
  const code = document.getElementById('accessCode').value.trim();
  const gateStatus = document.getElementById('gateStatus');
  if (!code) { gateStatus.textContent = "Введите код."; gateStatus.style.color = "var(--err)"; return; }

  gateStatus.textContent = "Проверка...";
  gateStatus.style.color = "var(--muted)";
  try {
    const resp = await fetch(ENDPOINT + "?code=" + encodeURIComponent(code));
    const raw = await resp.text();
    let result;
    try { result = JSON.parse(raw); }
    catch { throw new Error("Сервер вернул не JSON: " + raw.slice(0, 80)); }
    if (result.status === 'ok') {
      document.getElementById('fioDisplay').value = result.fio;
      document.getElementById('accessCodeHidden').value = code;
      document.getElementById('gateCard').style.display = "none";
      document.getElementById('formCard').style.display = "block";
      resize();
      pad.clear();
      loadRecords();
    } else {
      gateStatus.textContent = result.message || "Неверный код.";
      gateStatus.style.color = "var(--err)";
    }
  } catch (e) {
    gateStatus.textContent = "Ошибка проверки кода: " + e.message;
    gateStatus.style.color = "var(--err)";
  }
};

document.getElementById('submitBtn').onclick = async () => {
  const status = document.getElementById('status');
  const fio = document.getElementById('fioDisplay').value;
  const code = document.getElementById('accessCodeHidden').value;
  const fromDate = document.getElementById('fromDate').value;
  const toDate = document.getElementById('toDate').value;
  const reason = document.getElementById('reason').value;
  const other = document.getElementById('other').value;

  if(!fromDate || !toDate || !reason || pad.isEmpty()){
    status.textContent = "Заполните все обязательные поля и поставьте подпись.";
    status.className = "err";
    return;
  }

  const payload = { code, fromDate, toDate, reason, other, signature: pad.toDataURL('image/png') };
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; status.textContent = "Отправка..."; status.className = "";

  try{
    const resultText = await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", ENDPOINT, true);
      xhr.setRequestHeader("Content-Type", "text/plain;charset=utf-8");
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) resolve(xhr.responseText);
        else reject(new Error("HTTP " + xhr.status));
      };
      xhr.onerror = () => reject(new Error("network error"));
      xhr.send(JSON.stringify(payload));
    });

    let result;
    try { result = JSON.parse(resultText); } catch { result = null; }

    if (result && result.status === 'ok') {
      status.innerHTML = "✅ Сохранено!";
      status.className = "ok";
      setTimeout(() => { status.innerHTML = ""; status.className = ""; }, 2500);
      document.getElementById('fromDate').value = "";
      document.getElementById('toDate').value = "";
      document.getElementById('reason').value = "";
      document.getElementById('other').value = "";
      pad.clear();
      loadRecords();
    } else {
      status.textContent = "Сервер вернул ошибку: " + (result?.message || resultText || "неизвестно");
      status.className = "err";
    }
  }catch(e){
    status.textContent = "Ошибка отправки. Проверьте ссылку ENDPOINT.";
    status.className = "err";
  }
  btn.disabled = false;
};
</script>
</body>
</html>
